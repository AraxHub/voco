apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: voco
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.voco-online.ru
      secretName: voco-auth-tls
  rules:
    - host: auth.voco-online.ru
      http:
        paths:
          # Public OIDC / login / themes only.
          # /admin is intentionally NOT published — use port-forward from the VPS:
          #   kubectl -n voco port-forward svc/keycloak 8080:8080
          #   then open http://127.0.0.1:8080/admin  (via SSH -L if from your laptop)
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /js
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080

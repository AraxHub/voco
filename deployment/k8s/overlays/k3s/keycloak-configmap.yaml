apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-env
  namespace: voco
data:
  # Public / non-secret Keycloak + SMTP settings.
  # Passwords: Secret keycloak-secrets (create-secrets.sh).
  # KC_DB_URL задаётся в patch-keycloak-env.yaml через status.hostIP.

  KC_HOSTNAME: "auth.voco-online.ru"
  KC_HOSTNAME_STRICT: "false"
  KC_HEALTH_ENABLED: "true"

  KC_DB: "postgres"
  KC_DB_USERNAME: "voco"
  KC_DB_SCHEMA: "keycloak"

  # SMTP — Resend (или другой). Password: keycloak-secrets.KC_SMTP_PASSWORD
  KC_SMTP_HOST: "smtp.resend.com"
  KC_SMTP_PORT: "587"
  KC_SMTP_FROM: "noreply@voco-online.ru"
  KC_SMTP_FROM_DISPLAY_NAME: "VOCO"
  KC_SMTP_AUTH: "true"
  KC_SMTP_SSL: "false"
  KC_SMTP_STARTTLS: "true"

  KC_REALM: "voco"
  KC_CLIENT_ID: "voco-frontend"
  KC_FRONTEND_URL: "https://www.voco-online.ru"

apiVersion: v1
kind: Secret
metadata:
  name: voco-secrets
  namespace: voco
type: Opaque
stringData:
  # Fill real values via create-secrets.sh + secrets.env — do not commit secrets.
  VOCO_LIVEKIT_API_KEY: CHANGE_ME
  VOCO_LIVEKIT_API_SECRET: CHANGE_ME
  VOCO_PG_URL: CHANGE_ME

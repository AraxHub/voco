apiVersion: v1
kind: ConfigMap
metadata:
  name: voco-backend-env
  namespace: voco
data:
  VOCO_DEV_MODE: "false"
  VOCO_RELEASE_MODE: "prod"

  # WSS через ingress (см. ingress-livekit-wss.yaml). DNS: lk → IP VPS.
  VOCO_LIVEKIT_URL: "wss://lk.voco-online.ru"

  # Публичный URL API/инвайтов (HTTPS). www — основной домен.
  VOCO_SERVER_BASE_URL: "https://www.voco-online.ru"

  # CORS: фронт на www.
  VOCO_SERVER_CORS_ALLOWED_ORIGINS: "https://www.voco-online.ru"

  # Keycloak (JWT validation). Public URL reachable from backend + browsers.
  VOCO_KEYCLOAK_ENABLED: "true"
  VOCO_KEYCLOAK_URL: "https://auth.voco-online.ru"
  VOCO_KEYCLOAK_REALM: "voco"
  VOCO_KEYCLOAK_CLIENT_ID: "voco-frontend"

  # Logging
  VOCO_LOG_FORMAT: "text"
  VOCO_LOG_LEVEL: "info"
  VOCO_LOG_SERVICE: "voco-backend"
  VOCO_LOG_ENV: "prod"

  # Pool defaults (optional)
  VOCO_PG_MAX_CONNS: "10"
  VOCO_PG_CONNECT_TIMEOUT: "5s"

  # Features / sync / limits (see docs/)
  VOCO_FEATURES_USER_SYNC_INTERVAL: "15m"
  VOCO_FEATURES_MAX_IMAGE_BYTES: "10485760"
  VOCO_FEATURES_MAX_FILE_BYTES: "26214400"

  # Keycloak Admin API (user directory sync). Credentials live in Secret.
  VOCO_KEYCLOAK_ADMIN_ENABLED: "true"
  VOCO_KEYCLOAK_ADMIN_BASE_URL: "http://keycloak:8080"
  VOCO_KEYCLOAK_ADMIN_REALM: "voco"
  VOCO_KEYCLOAK_ADMIN_CLIENT_ID: "voco-backend-admin"

  # Web Push — public key in ConfigMap; private in Secret
  # VOCO_WEBPUSH_VAPID_PUBLIC set via secret preferred; optional here for FE endpoint
  VOCO_WEBPUSH_VAPID_SUBJECT: "mailto:admin@voco-online.ru"

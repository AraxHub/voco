apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voco

resources:
  - base/namespace.yaml
  - base/frontend/deployment.yaml
  - base/frontend/service.yaml
  - base/backend/deployment.yaml
  - base/backend/service.yaml
  - base/livekit/deployment.yaml
  - base/livekit/service.yaml
  - base/keycloak/deployment.yaml
  - base/keycloak/service.yaml
  - base/ingress.yaml
  - ingress-livekit-wss.yaml
  - ingress-keycloak.yaml
  - backend-configmap.yaml
  - keycloak-configmap.yaml
  - livekit-configmap.yaml

images:
  - name: voco-backend
    newName: ghcr.io/araxhub/voco-backend
    newTag: latest
  - name: voco-frontend
    newName: ghcr.io/araxhub/voco-frontend
    newTag: latest

patches:
  - path: patch-backend-env.yaml
  - path: patch-keycloak-env.yaml
  - path: patch-livekit-service-nodeport.yaml
  - path: patch-livekit-service-udp-nodeport.yaml
  - path: patch-backend-image.yaml
  - path: patch-frontend-image.yaml
